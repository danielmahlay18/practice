<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d3c8c8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 4px 4px 8px rgb(12, 11, 11);
            width: 100%;
            max-width: 400px;
            flex-direction: column;
        }

        form div {
            margin-bottom: 15px;

        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="tel"],
        input[type="password"] {
            width: 90%;
            padding: 8px;
            border: 1px solid #e64a4a;
            border-radius: 3px;
        }

        button {
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        #level-options {
            display: flex;
            flex: auto;
            flex-direction: row;
        }

        #res {
            background-color: #f44336;
            color: white;
        }

        #sub {
            background-color: #4CAF50;
            color: white;
            float: right;
        }

        /* Level radio buttons - horizontal layout */
       

    </style>
</head>
<body>
    <h1>User Information Form</h1>
    <form action="results.html.html" method="get">
        <div>
            <label for="name">Name</label>
            <input type="text" name="name" id="name" required>
        </div>
        
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>
        </div>
        
        <div>
            <label for="age">Age</label>
            <input type="number" name="age" id="age" required>
        </div>
        
        <div>
            <label>Gender</label>
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" name="phone" id="phone">
        </div>

        <div>
            <label>Level</label>

          <div id="level-options">
            <label><input type="radio" name="level" value="100">100 Level</label>
            <label><input type="radio" name="level" value="200">200 Level</label>
            <label><input type="radio" name="level" value="300">300 Level</label>
            <label><input type="radio" name="level" value="400">400 Level</label>
            <label><input type="radio" name="level" value="500">500 Level</label>
          </div>
        </div>
        
        <div>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
        </div>

      <button type="reset" id="res">Reset</button>
        <button type="submit" id="sub">Submit</button>
  
    </form>
</body>
</html>
